<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMG RFP Manager — Apex Management Group</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#ECF0F8;color:#1A2535;min-height:100vh;line-height:1.5}
input,textarea,select,button{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* ===== VARIABLES ===== */
:root{
  --navy:#0D1C2E;--navy2:#132436;--navy3:#1A2F42;--navy4:#213A52;--navy5:#2A4763;
  --blue:#2563EB;--blue-h:#1D4ED8;--blue-lt:#EFF6FF;--blue-bd:#BFDBFE;
  --white:#FFFFFF;
  --g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;--g300:#CBD5E1;--g400:#94A3B8;--g500:#64748B;--g600:#475569;--g700:#334155;--g900:#0F172A;
  --green:#059669;--green-lt:#ECFDF5;--green-bd:#A7F3D0;
  --amber:#D97706;--amber-lt:#FFFBEB;
  --red:#DC2626;--red-lt:#FFF1F1;
  --r:8px;--rlg:12px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 6px rgba(0,0,0,.05);
  --shmd:0 4px 16px rgba(0,0,0,.1);
  --shlg:0 8px 32px rgba(0,0,0,.14);
}

/* ===== HEADER ===== */
.app-hdr{background:var(--navy);height:64px;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.4);gap:12px}
.hdr-logo{display:flex;align-items:center;gap:10px;flex:1}
.logo-badge{background:var(--blue);color:#fff;font-size:13px;font-weight:800;padding:5px 9px;border-radius:6px;letter-spacing:.5px;white-space:nowrap}
.logo-name{color:#fff;font-size:15px;font-weight:700;display:block;line-height:1.1}
.logo-sub{color:var(--g400);font-size:11px;display:block}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-crumb{color:var(--g400);font-size:13px}
.hdr-crumb a{color:var(--g400);transition:color .15s}
.hdr-crumb a:hover{color:#fff}
.stat-chip{background:var(--white);border:1px solid var(--g200);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--g600);display:inline-flex;align-items:center;gap:6px}
.pref-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.3px;white-space:nowrap}
.pref-preferred{background:#dcfce7;color:#166534;border:1px solid #86efac}
.pref-unsure{background:#fff7ed;color:#92400e;border:1px solid #fcd34d}
.pref-trouble{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.pref-none{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1}
.ctr-search-bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ctr-search-bar input{flex:1;min-width:160px}
.ctr-search-bar select{min-width:150px}
.hdr-crumb span{color:#fff;font-weight:600}

/* ===== LAYOUT ===== */
#app-main{max-width:960px;margin:0 auto;padding:28px 16px 80px}

/* ===== CARDS ===== */
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);box-shadow:var(--sh);padding:24px;margin-bottom:16px}
.card-hd{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:8px}
.card-ico{width:28px;height:28px;background:var(--blue-lt);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* ===== FORMS ===== */
.fg{display:flex;flex-direction:column;gap:5px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.fg1{display:grid;grid-template-columns:1fr;gap:16px}
.sp2{grid-column:span 2}
.sp3{grid-column:span 3}
label{font-size:13px;font-weight:600;color:var(--g700)}
label .req{color:var(--red);margin-left:2px}
input[type=text],input[type=email],input[type=date],input[type=number],input[type=tel],select,textarea{
  border:1.5px solid var(--g300);border-radius:var(--r);padding:8px 12px;font-size:14px;
  color:var(--g900);background:var(--white);outline:none;transition:border-color .15s,box-shadow .15s;width:100%
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
input::placeholder,textarea::placeholder{color:var(--g400)}
textarea{resize:vertical;min-height:110px;line-height:1.6}
.fhint{font-size:12px;color:var(--g400)}
input.err,textarea.err,select.err{border-color:var(--red)}
.err-msg{font-size:12px;color:var(--red);margin-top:2px}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;font-size:14px;font-weight:600;border-radius:var(--r);border:none;cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--navy3);box-shadow:var(--shmd)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover:not(:disabled){background:var(--blue-h);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--g300)}
.btn-outline:hover:not(:disabled){background:var(--g50);border-color:var(--g400)}
.btn-ghost{background:transparent;color:var(--g500);border:none;padding:8px 12px}
.btn-ghost:hover{background:var(--g100);color:var(--navy)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){background:#B91C1C}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover:not(:disabled){background:#047857}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-lg{padding:11px 24px;font-size:15px}

/* ===== STEP INDICATOR ===== */
.stepper{display:flex;align-items:flex-start;margin-bottom:24px;overflow-x:auto;padding-bottom:4px}
.s-item{display:flex;align-items:flex-start;flex-shrink:0}
.s-inner{display:flex;flex-direction:column;align-items:center}
.s-bub{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--g300);background:var(--white);color:var(--g400);transition:all .2s;flex-shrink:0}
.s-bub.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.18)}
.s-bub.done{background:var(--green);border-color:var(--green);color:#fff}
.s-lbl{font-size:10px;font-weight:600;color:var(--g400);text-align:center;margin-top:4px;white-space:nowrap;max-width:64px}
.s-lbl.active{color:var(--blue)}
.s-lbl.done{color:var(--green)}
.s-conn{height:2px;width:36px;background:var(--g200);flex-shrink:0;margin-top:14px;transition:background .2s}
.s-conn.done{background:var(--green)}

/* ===== STEP NAV ===== */
.step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--g200)}
.snl{display:flex;gap:8px;flex:1}
.snr{display:flex;gap:8px;flex:1;justify-content:flex-end}
.snc{flex:1;text-align:center}
.amg-rec-radios{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.amg-rec-label{display:flex;align-items:center;gap:7px;padding:8px 14px;border:1.5px solid var(--g300);border-radius:8px;cursor:pointer;font-size:13px;transition:border-color .15s,background .15s;user-select:none}
.amg-rec-label:hover{border-color:var(--blue);background:var(--blue-lt)}
.amg-rec-label input[type=radio]{accent-color:var(--navy);width:15px;height:15px;cursor:pointer}
.amg-rec-selected{border-color:var(--green)!important;background:var(--green-lt)!important;font-weight:600;color:var(--navy)}

/* ===== STEP HEADER ===== */
.step-hd{margin-bottom:20px}
.step-title{font-size:20px;font-weight:800;color:var(--navy)}
.step-sub{font-size:13px;color:var(--g500);margin-top:3px}

/* ===== DASHBOARD ===== */
.dash-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.dash-hd{font-size:22px;font-weight:800;color:var(--navy)}
.dash-sub{font-size:13px;color:var(--g500);margin-top:2px}
/* Legacy list layout kept for potential reuse */
.proj-grid{display:flex;flex-direction:column;gap:10px}
.proj-card{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);transition:box-shadow .15s,border-color .15s;cursor:pointer}
.proj-card:hover{box-shadow:var(--shmd);border-color:var(--g300)}
.proj-icon{width:44px;height:44px;border-radius:var(--r);background:var(--blue-lt);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.proj-body{flex:1;min-width:0}
.proj-name{font-size:15px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:12px;color:var(--g500);margin-top:2px}
.proj-acts{display:flex;gap:6px;flex-shrink:0}
.empty-state{text-align:center;padding:56px 24px;color:var(--g400)}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty-h{font-size:17px;color:var(--g500);font-weight:600;margin-bottom:6px}
.empty-p{font-size:13px}
/* ===== KANBAN ===== */
.kanban-wrap{overflow-x:auto;padding-bottom:20px;margin:0 -4px}
.kanban-board{display:flex;gap:10px;padding:0 4px 4px;align-items:flex-start;min-width:max-content}
.kanban-col{width:210px;flex-shrink:0;display:flex;flex-direction:column}
.kanban-hd{padding:9px 12px;border-radius:8px 8px 0 0;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.kanban-hd .k-step{font-size:9px;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:99px;font-weight:700;letter-spacing:.5px}
.kanban-hd .k-count{font-size:10px;background:rgba(255,255,255,.22);min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.kanban-body{display:flex;flex-direction:column;gap:7px;min-height:90px;background:var(--g50);border:1px solid var(--g200);border-top:none;border-radius:0 0 8px 8px;padding:8px}
.k-card{background:var(--white);border:1px solid var(--g200);border-radius:6px;padding:10px 12px;cursor:pointer;transition:box-shadow .15s,border-color .15s;position:relative}
.k-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);border-color:var(--g300)}
.k-card-name{font-size:12px;font-weight:700;color:var(--navy);line-height:1.35;margin-bottom:2px;padding-right:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.k-card-assoc{font-size:11px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.k-card-foot{display:flex;align-items:center;justify-content:space-between}
.k-card-date{font-size:10px;color:var(--g400)}
.k-card-del{background:none;border:none;color:var(--g300);cursor:pointer;font-size:13px;line-height:1;padding:2px 3px;border-radius:4px;opacity:0;transition:opacity .1s,color .1s;flex-shrink:0}
.k-card:hover .k-card-del{opacity:1}
.k-card-del:hover{color:var(--red)!important}
.k-empty{text-align:center;padding:18px 8px;color:var(--g300);font-size:11px;line-height:1.5}

/* ===== BADGES ===== */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.bd-draft{background:var(--g100);color:var(--g600)}
.bd-sent{background:var(--blue-lt);color:#1D4ED8}
.bd-bids{background:var(--amber-lt);color:var(--amber)}
.bd-complete{background:var(--green-lt);color:var(--green)}

/* ===== CONTRACTOR LIST ===== */
.ctr-list{display:flex;flex-direction:column;gap:6px}
.ctr-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--r);transition:all .15s}
.ctr-item:hover{background:var(--white);border-color:var(--g300)}
.ctr-item.selected{background:var(--blue-lt);border-color:var(--blue-bd)}
.ctr-chk{width:18px;height:18px;cursor:pointer;accent-color:var(--blue);flex-shrink:0}
.ctr-info{flex:1;min-width:0}
.ctr-name{font-size:14px;font-weight:600;color:var(--navy)}
.ctr-meta{font-size:12px;color:var(--g500)}
.ctr-trade{font-size:11px;font-weight:600;background:var(--g100);color:var(--g600);padding:2px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.add-ctr-form{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rlg);padding:18px;margin-top:12px}
.add-ctr-form .fg2{margin-bottom:12px}

/* ===== PHOTO UPLOAD ===== */
.photo-zone{border:2px dashed var(--g300);border-radius:var(--rlg);padding:28px;text-align:center;cursor:pointer;transition:all .15s;background:var(--g50)}
.photo-zone:hover{border-color:var(--blue);background:var(--blue-lt)}
.photo-zone .pz-ico{font-size:30px;margin-bottom:6px}
.photo-zone p{font-size:13px;color:var(--g500)}
.photo-zone strong{color:var(--blue)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.photo-thumb{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1;background:var(--g100);border:1px solid var(--g200)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph-rm{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:700;border:none;transition:background .15s}
.ph-rm:hover{background:var(--red)}

/* ===== BID TABLE ===== */
.bid-wrap{overflow-x:auto}
.bid-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.bid-tbl th{background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:9px 10px;text-align:left;white-space:nowrap}
.bid-tbl th:first-child{border-radius:8px 0 0 0}
.bid-tbl th:last-child{border-radius:0 8px 0 0}
.bid-tbl td{padding:8px 10px;border-bottom:1px solid var(--g200);vertical-align:top}
.bid-tbl tr:last-child td{border-bottom:none}
.bid-tbl tr:hover td{background:var(--g50)}
.bid-tbl tr.low-bid td{background:var(--green-lt)!important}
.bid-tbl tr.low-bid td:first-child{border-left:3px solid var(--green)}
.att-btn{display:inline-block;padding:3px 9px;background:#f0f4ff;border:1px dashed var(--navy);border-radius:5px;font-size:11px;color:var(--navy);cursor:pointer;white-space:nowrap}
.att-btn:hover{background:#dde6ff}
.att-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#e8f0ff;border:1px solid #6b9af8;border-radius:12px;font-size:11px;color:#1a3a6e;max-width:160px}
.att-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.att-rm{background:none;border:none;color:#888;cursor:pointer;font-size:14px;line-height:1;padding:0 1px;flex-shrink:0}
.att-rm:hover{color:#c00}
.bid-in{width:100%;border:1px solid var(--g300);border-radius:5px;padding:5px 7px;font-size:13px;min-width:90px}
.bid-in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.12)}

/* ===== RFP PREVIEW ===== */
.rfp-prev{background:var(--white);border:1px solid var(--g200);border-radius:var(--rlg);padding:44px;font-size:14px;line-height:1.7;box-shadow:var(--shmd)}
.rfp-prev h1{font-size:20px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:2px}
.rfp-prev .rfp-sub{text-align:center;color:var(--g500);font-size:13px;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--navy)}
.rfp-prev h2{font-size:14px;font-weight:800;color:var(--navy);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px;padding-bottom:5px;border-bottom:1.5px solid var(--g200)}
.rfp-prev .meta-row{display:flex;padding:5px 0;font-size:13px;border-bottom:1px solid var(--g100)}
.rfp-prev .meta-lbl{font-weight:600;color:var(--g700);width:180px;flex-shrink:0}
.rfp-prev .meta-val{color:var(--g900)}
.rfp-prev .scope-block{background:var(--g50);border-left:3px solid var(--blue);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;white-space:pre-wrap;font-size:13px;color:var(--g700)}
.rfp-prev p{margin-bottom:6px;font-size:13px;color:var(--g700)}

/* ===== INFO BOXES ===== */
.info-box{background:var(--blue-lt);border:1px solid var(--blue-bd);border-radius:var(--r);padding:10px 14px;font-size:13px;color:#1E40AF;display:flex;gap:8px;margin-bottom:14px}
.warn-box{background:var(--amber-lt);border:1px solid #FDE68A;border-radius:var(--r);padding:10px 14px;font-size:13px;color:#92400E;display:flex;gap:8px;margin-bottom:14px}
.success-box{background:var(--green-lt);border:1px solid var(--green-bd);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.success-box .sb-lbl{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
.success-box .sb-val{font-size:18px;font-weight:800;color:#065F46}

/* ===== MODAL ===== */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-ov.hidden{display:none}
.modal-box{background:var(--white);border-radius:var(--rlg);padding:26px;max-width:500px;width:100%;box-shadow:var(--shlg)}
.modal-title{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:14px}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* ===== TOAST ===== */
#toast-ct{position:fixed;bottom:22px;right:22px;z-index:2000;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--g900);color:#fff;padding:11px 15px;border-radius:var(--r);font-size:14px;box-shadow:var(--shlg);display:flex;align-items:center;gap:8px;pointer-events:all;animation:tsi .2s ease;min-width:220px;max-width:320px}
.toast.succ{background:var(--green)}
.toast.err{background:var(--red)}
.toast.warn{background:var(--amber)}
@keyframes tsi{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== EMAIL ===== */
.email-prev{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r);padding:14px;font-size:13px;white-space:pre-wrap;line-height:1.7;color:var(--g700);max-height:280px;overflow-y:auto}
.email-subj{background:var(--white);border:1.5px solid var(--g300);border-radius:var(--r);padding:8px 12px;font-size:14px;width:100%;margin-bottom:8px}

/* ===== MISC ===== */
.divider{height:1px;background:var(--g200);margin:18px 0}
.text-muted{color:var(--g500);font-size:13px}
.sel-count{background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.bid-lo-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lo-card{flex:1;min-width:180px;background:var(--green-lt);border:1px solid var(--green-bd);border-radius:var(--r);padding:12px 16px}
.lo-lbl{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
.lo-val{font-size:16px;font-weight:800;color:#065F46;margin-top:2px}
.lo-sub{font-size:12px;color:var(--green);margin-top:1px}
.section-sep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--g400);margin:20px 0 10px}
.step-progress{font-size:12px;color:var(--g500);margin-bottom:6px}

'use strict';

const APP_KEY = 'amg_rfp_v2';
const CTR_KEY = 'amg_ctrs_v2';

/* =====================================================

===================================================== */
const SUPABASE_URL = 'https://ndwogjzxisanjxhjvwgr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd29nanp4aXNhbmp4aGp2d2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MTY0MTcsImV4cCI6MjA5MjE5MjQxN30.M0LhgpeIuVXareTnmIwhtWMOVasxMEWSRZ7hpB0IT8o';
const sb = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;  // stays null until credentials are filled in

async function sbLoad() {
  if (!sb) return;
  try {
    const [{ data: projRows }, { data: ctrRows }] = await Promise.all([
      sb.from('projects').select('id, data'),
      sb.from('contractors').select('id, data'),
    ]);
    if (projRows) {
      S.projects = projRows.map(r => r.data);
      localStorage.setItem(APP_KEY, JSON.stringify({projects: S.projects}));
    }
    if (ctrRows && ctrRows.length > 0) {
      S.contractors = ctrRows.map(r => r.data);
      localStorage.setItem(CTR_KEY, JSON.stringify(S.contractors));
    }
    render();
  } catch(e) { console.warn('Supabase load error:', e); }
}

async function sbSaveProject(p) {
  if (!sb) return;
  try {
    await sb.from('projects').upsert({ id: p.id, data: p, updated_at: new Date().toISOString() });
  } catch(e) { console.warn('Supabase save error:', e); }
}

async function sbDeleteProject(id) {
  if (!sb) return;
  try { await sb.from('projects').delete().eq('id', id); } catch(e) { console.warn('Supabase delete error:', e); }
}

async function sbSaveContractors() {
  if (!sb) return;
  try {
    const rows = S.contractors.map(c => ({ id: c.id, data: c }));
    await sb.from('contractors').upsert(rows);
  } catch(e) { console.warn('Supabase contractors save error:', e); }
}

/* =====================================================
   STORAGE
===================================================== */
function loadData() {
  try {
    const raw = localStorage.getItem(APP_KEY);
    if (raw) { const d = JSON.parse(raw); S.projects = d.projects || []; }
    const ctrs = localStorage.getItem(CTR_KEY);
    S.contractors = ctrs ? JSON.parse(ctrs) : [...DEFAULT_CONTRACTORS];
    S.apiKey    = localStorage.getItem(API_KEY_STORE)    || '';
  S.mondayKey = localStorage.getItem(MONDAY_KEY_STORE) || '';
  } catch(e) { console.error('Load error:', e); S.projects = []; S.contractors = [...DEFAULT_CONTRACTORS]; }
}

function saveData() {
  try {
    localStorage.setItem(APP_KEY, JSON.stringify({projects: S.projects}));
    localStorage.setItem(CTR_KEY, JSON.stringify(S.contractors));
  } catch(e) {
    if (e.name === 'QuotaExceededError') toast('Storage full — try removing photos', 'warn');
  }
}

function proj(id) { return S.projects.find(p => p.id === (id || S.currentId)); }

function upProj(updates) {
  const i = S.projects.findIndex(p => p.id === S.currentId);
  if (i >= 0) {
    S.projects[i] = {...S.projects[i], ...updates, updatedAt: now()};
    saveData();
    sbSaveProject(S.projects[i]); // background sync to Supabase
  }
}

function now() { return new Date().toISOString(); }
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) { if (!d) return '—'; try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch(e) { return d; } }
function fmtMoney(v) { if (!v) return ''; const n = parseFloat(v); return isNaN(n) ? '' : '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function parseMoney(v) { if (!v) return null; const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return isNaN(n) ? null : n; }

function genRfpNumber() {
  const year = new Date().getFullYear();
  const seq = String((S.projects||[]).length + 1).padStart(3,'0');
  return 'AMG-RFP-' + year + '-' + seq;
}

function mkProj() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).substr(2,5),
    status:'Draft',createdAt:now(),updatedAt:now(),step:1,
    rfpNumber:genRfpNumber(),
    associationName:'',propertyAddress:'',projectName:'',
    bidDueDate:'',bidDueTime:'2:00 PM EDT',
    anticipatedStartDate:'',completionDate:'',
    preparedBy:'',contactTitle:'Property Manager',contactPhone:'',contactEmail:'',

    selectedContractors:[],emailBodyOverride:'',rfpSentAt:null,
    bids:{}
  };
}

function openProj(id) {
  S.currentId=id; const p=proj(); S.step=p.step||1; S.view='step'; S.showAddCtr=false; S.editEmailBody=false;
  render();
}

function newProj() {
  const p=mkProj(); S.projects.unshift(p); S.currentId=p.id; S.step=1; S.view='step'; S.showAddCtr=false;
  saveData(); sbSaveProject(p); render();
}

function goStep(n) {
  if (n<1||n>7) return;
  S.step=n; S.showAddCtr=false; S.editEmailBody=false;
  upProj({step:n}); render();
}

function nextStep() { collectStep(S.step); if (!validateStep(S.step)) return; goStep(S.step+1); }
function prevStep() { collectStep(S.step); goStep(S.step-1); }
function goToStep(n) {
  if (S.view !== 'step') return;
  collectStep(S.step);
  S.step = n;
  render();
  window.scrollTo(0,0);
}
window.goToStep = goToStep;

/* =====================================================
   COLLECT STEP DATA
===================================================== */
function collectStep(n) {
  const p = proj(); if (!p) return;
  const g = id => { const el=document.getElementById(id); return el?el.value.trim():''; };
  if (n===1) {
    upProj({associationName:g('f-assoc'),propertyAddress:g('f-addr'),projectName:g('f-proj'),
      rfpNumber:g('f-rfp'),bidDueDate:g('f-due'),bidDueTime:g('f-due-time'),
      anticipatedStartDate:g('f-start'),completionDate:g('f-complete'),
      preparedBy:g('f-by'),contactTitle:g('f-ctitle'),contactPhone:g('f-cphone'),contactEmail:g('f-cemail'),
      datePrepared:g('f-date')});
  } else if (n===2) {
    upProj({scopeDescription:g('f-scope'),scopeExclusions:g('f-excl'),scopeBrief:g('f-brief'),specialInstructions:g('f-special'),siteAccessNotes:g('f-access'),alternate1:g('f-alt1'),alternate2:g('f-alt2')});
  } else if (n===5) {
    const sub = document.getElementById('f-esubj'); const body = document.getElementById('f-ebody');
    if (body) upProj({emailBodyOverride: body.value});
  }
}

/* =====================================================
   VALIDATE STEPS
===================================================== */
function validateStep(n) {
  clearErrors();
  const p = proj(); if (!p) return false;
  let ok = true;
  const req = (id, msg) => { const el=document.getElementById(id); if(!el||!el.value.trim()){if(el){el.classList.add('err');showErrMsg(el,msg||'Required');}ok=false;} };
  if (n===1) {
    req('f-assoc','Association name required'); req('f-proj','Project name required'); req('f-due','Bid due date required'); req('f-by','Prepared by required');
  } else if (n===3) {
    if (!p.selectedContractors || p.selectedContractors.length===0) { toast('Select at least one contractor to include','warn'); ok=false; }
  }
  return ok;
}

function clearErrors() {
  document.querySelectorAll('.err').forEach(el=>el.classList.remove('err'));
  document.querySelectorAll('.err-msg').forEach(el=>el.remove());
}
function showErrMsg(el, msg) {
  const d=document.createElement('div'); d.className='err-msg'; d.textContent=msg;
  el.parentNode.insertBefore(d, el.nextSibling);
}

/* =====================================================
   MASTER RENDER
===================================================== */
function render() {
  const main = document.getElementById('app-main');
  const hdr = document.getElementById('hdr-right');
  if (S.view==='dashboard') {

}

function renderStepper() {

  STEP_LABELS.forEach((lbl, i) => {
    const n = i+1;

    const maxDone = p ? (p.step||1) : 1;

    const cls = done ? 'done' : active ? 'active' : '';
    if (i > 0) html += `<div class="s-conn${done?' done':''}"></div>`;

function renderStepNav() {
  const p = proj();
  const isFirst = S.step === 1;

  let left = isFirst
    ? `<button class="btn btn-ghost" data-action="dashboard">← Dashboard</button>`
    : `<button class="btn btn-outline" data-action="prev">← Back</button>`;

  let right = '';

}

/* --- STEP 3: CONTRACTOR SELECTION --- */
function prefBadge(status) {
  if (!status || status === '') return '<span class="pref-badge pref-none">No Status</span>';
  if (status === 'Preferred') return '<span class="pref-badge pref-preferred">⭐ Preferred</span>';
  if (status === 'Had Trouble In Past') return '<span class="pref-badge pref-trouble">⚠ Had Trouble</span>';
  if (status === 'Unsure') return '<span class="pref-badge pref-unsure">? Unsure</span>';
  return `<span class="pref-badge pref-none">${esc(status)}</span>`;
}

function prefSort(a, b) {
  const order = { 'Preferred': 0, 'Unsure': 1, '': 2, 'Had Trouble In Past': 3 };
  const ao = order[a.preferredStatus || ''] ?? 2;
  const bo = order[b.preferredStatus || ''] ?? 2;
  if (ao !== bo) return ao - bo;
  return (a.name||'').localeCompare(b.name||'');
}

function buildCtrItems(search, trade) {
  const p = proj(); if (!p) return '';
  // No specialty selected → show prompt
  if (trade === '') return '<div style="padding:28px;text-align:center;color:var(--g400);font-size:14px">👆 Select a specialty above to view contractors.</div>';
  const sel = p.selectedContractors || [];
  const q = (search||'').toLowerCase().trim();

  let list = [...S.contractors];

  // Filter by search
  if (q) list = list.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.trade||'').toLowerCase().includes(q) ||
    (c.contact||'').toLowerCase().includes(q)
  );
  // 'ALL' = show all, otherwise filter by specific trade
  if (trade !== 'ALL') list = list.filter(c => (c.trade||'') === trade);

  // Sort: Preferred first, then alphabetical within group
  list.sort(prefSort);

  if (list.length === 0) return '<div style="padding:20px;text-align:center;color:var(--g400)">No contractors match your search.</div>';

  return list.map(ctr => {
    const isSelected = sel.includes(ctr.id);
    const ps = ctr.preferredStatus || '';
    return `<div class="ctr-item${isSelected?' selected':''}">
      <input type="checkbox" class="ctr-chk" id="ctr-${ctr.id}" data-action="toggle-ctr" data-id="${ctr.id}" ${isSelected?'checked':''}>
      <div class="ctr-info">
        <div class="ctr-name" style="display:flex;align-items:center;gap:6px">${esc(ctr.name)} ${prefBadge(ps)}</div>

  const cnt = document.getElementById('ctr-sel-count');
  if (cnt) cnt.textContent = p.selectedContractors?.length > 0 ? p.selectedContractors.length + ' selected' : '';

/* =====================================================
   MONDAY.COM SYNC
===================================================== */
async function syncFromMonday() {
  let apiKey = S.mondayKey;
  if (!apiKey) {
    apiKey = prompt('Enter your Monday.com API token to sync contractors:\n(Find it at: monday.com → Avatar → Administration → API → Personal Token)\nStored locally — never shared.');
    if (!apiKey || !apiKey.trim()) return;
    S.mondayKey = apiKey.trim();
    localStorage.setItem(MONDAY_KEY_STORE, S.mondayKey);
  }

  const btn = document.getElementById('monday-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing...'; }
  toast('Syncing contractors from Monday.com...', 'info');

  // Groups to exclude
  const EXCLUDE_GROUPS = ['no longer use', 'new vendors to be sorted'];
  // Non-contractor group keywords to skip
  const SKIP_GROUPS = ['attorney','legal','credit','financial','software','insurance','tax','interpreting','spa','state'];

  try {
    let allItems = [];
    let cursor = null;
    let pageCount = 0;

    do {
      pageCount++;
      const cursorClause = cursor ? `, cursor: "${cursor}"` : '';
      const query = `{
        boards(ids: [${MONDAY_BOARD_ID}]) {
          items_page(limit: 500${cursorClause}) {
            cursor
            items {
              id
              name
              group { id title }
              column_values(ids: ["email8","email","phone","text34","text8","text6","color_mm2h8jmv"]) {
                id text
              }
            }
          }
        }
      }`;

      const resp = await fetch('https://api.monday.com/v2', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': S.mondayKey,
          'API-Version': '2024-04'
        },
        body: JSON.stringify({ query })
      });

      if (!resp.ok) {
        const errText = await resp.text().catch(()=>'');
        if (resp.status === 401 || resp.status === 403) {
          S.mondayKey = ''; localStorage.removeItem(MONDAY_KEY_STORE);
          throw new Error('Invalid Monday.com token — cleared. Re-enter to try again.');
        }
        throw new Error('Monday.com API error ' + resp.status + ': ' + errText.slice(0,200));
      }

      const data = await resp.json();
      if (data.errors?.length) throw new Error(data.errors[0].message);

      const page = data?.data?.boards?.[0]?.items_page;
      if (!page) throw new Error('Unexpected Monday.com response format');

      allItems = allItems.concat(page.items || []);
      cursor = page.cursor || null;

    } while (cursor && pageCount < 10);

    // Map items to contractor objects
    const contractors = [];
    const seen = new Set();

    for (const item of allItems) {
      const groupTitle = (item.group?.title || '').toLowerCase().trim();

      // Skip excluded/non-contractor groups
      if (EXCLUDE_GROUPS.some(eg => groupTitle.includes(eg))) continue;
      if (SKIP_GROUPS.some(sg => groupTitle.includes(sg))) continue;

      // Get column values
      const cols = {};
      for (const cv of (item.column_values || [])) {
        cols[cv.id] = cv.text || '';
      }

      const name  = (item.name || '').trim();
      const email = (cols['email8'] || cols['email'] || '').trim();
      const phone = (cols['phone'] || '').trim();
      const work  = (cols['text34'] || '').trim();
      const firstName = (cols['text8'] || '').trim();
      const lastName  = (cols['text6'] || '').trim();
      const contact   = [firstName, lastName].filter(Boolean).join(' ');
      const preferredStatus = (cols['color_mm2h8jmv'] || '').trim();

      // Skip if no name
      if (!name) continue;

      // Deduplicate by name (case-insensitive)
      const nameKey = name.toLowerCase();
      if (seen.has(nameKey)) continue;
      seen.add(nameKey);

      // Always use group title as trade for consistent specialty filtering
      const rawGroup = (item.group?.title || '').trim();
      const trade = rawGroup || work;

      contractors.push({
        id: 'mon-' + item.id,
        name,
        trade,
        email,
        phone,
        contact,
        preferredStatus,
        license: ''
      });
    }

    if (contractors.length === 0) {
      toast('No contractors found — check your token or board access.', 'warn');
      return;
    }

    // Merge: keep existing non-Monday contractors, replace Monday ones
    const nonMonday = S.contractors.filter(c => !c.id.startsWith('mon-'));
    S.contractors = [...contractors, ...nonMonday];
    localStorage.setItem(CTR_KEY, JSON.stringify(S.contractors));
    sbSaveContractors();
    render();

    toast('✓ Synced ' + contractors.length + ' contractors from Monday.com!', 'succ');

  } catch(e) {
    console.error('Monday sync error:', e);
    toast('Sync failed: ' + e.message, 'err');
  } finally {
    const b = document.getElementById('monday-sync-btn');
    if (b) { b.disabled = false; b.textContent = '🔄 Sync from Monday.com'; }
  }
}

  // ── Render to canvas then build PDF ──
  toast('Generating PDF — please wait...', 'info');

  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-9999px;top:0;width:980px;background:white;z-index:-1';
  container.innerHTML = innerHtml;
  document.body.appendChild(container);

  try {
    // Render HTML → canvas at 2× resolution
    const canvas = await html2canvas(container, {
      scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff',
      logging: false
    });
    document.body.removeChild(container);

    // Set up pdf-lib
    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.create();

    // Letter page dimensions in points
    const PW = 612, PH = 792, MARGIN = 32;
    const contentW = PW - 2 * MARGIN;
    const contentH = PH - 2 * MARGIN;

    // Scale factor: canvas pixels → PDF points
    // canvas is 2× so real pixel width = canvas.width/2
    const ptPerPx = contentW / (canvas.width / 2);
    const totalPtH = (canvas.height / 2) * ptPerPx;
    const numPages = Math.ceil(totalPtH / contentH);

    for (let i = 0; i < numPages; i++) {
      // How many canvas pixels for one page height
      const pxPerPage = contentH / ptPerPx;
      const srcY = Math.round(i * pxPerPage * 2); // ×2 for 2× canvas
      const srcH = Math.min(Math.round(pxPerPage * 2), canvas.height - srcY);
      if (srcH <= 0) break;

      const slice = document.createElement('canvas');
      slice.width  = canvas.width;
      slice.height = srcH;
      slice.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);

      const jpegDataUrl = slice.toDataURL('image/jpeg', 0.92);
      const jpegB64 = jpegDataUrl.split(',')[1];
      const jpgImg  = await pdfDoc.embedJpg(jpegB64);

      const drawH = (srcH / 2) * ptPerPx;
      const page  = pdfDoc.addPage([PW, PH]);
      page.drawImage(jpgImg, { x: MARGIN, y: PH - MARGIN - drawH, width: contentW, height: drawH });
    }

    // ── Append contractor PDF attachments ──
    let attachCount = 0;
    for (const ctr of selCtrs) {
      const att = (bids[ctr.id]||{}).attachment;
      if (!att) continue;
      const ext = att.name.split('.').pop().toLowerCase();
      try {
        if (ext === 'pdf') {
          const b64 = att.data.split(',')[1];
          const srcDoc = await PDFDocument.load(b64, { ignoreEncryption: true });
          const indices = srcDoc.getPageIndices();
          const pages  = await pdfDoc.copyPages(srcDoc, indices);
          pages.forEach(pg => pdfDoc.addPage(pg));
          attachCount++;
        } else if (['jpg','jpeg','png'].includes(ext)) {
          const b64 = att.data.split(',')[1];
          const img  = ext === 'png' ? await pdfDoc.embedPng(b64) : await pdfDoc.embedJpg(b64);
          const page = pdfDoc.addPage([PW, PH]);
          const ratio  = img.width / img.height;
          let iw = contentW, ih = contentW / ratio;
          if (ih > contentH) { ih = contentH; iw = contentH * ratio; }
          page.drawImage(img, { x: (PW-iw)/2, y: (PH-ih)/2, width: iw, height: ih });
          attachCount++;
        }
      } catch(e) { console.warn('Could not embed attachment for', ctr.name, e.message); }
    }

    // ── Save + download ──
    const bytes = await pdfDoc.save();
    const blob  = new Blob([bytes], { type: 'application/pdf' });
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    a.href = url;
    a.download = `AMG Bid Comparison – ${p.associationName||'Association'} – ${p.projectName||'Project'}.pdf`;
    a.click();
    URL.revokeObjectURL(url);

    const msg = attachCount > 0
      ? `Downloaded! Bid comparison + ${attachCount} bid attachment(s) combined into one PDF.`
      : 'Bid comparison PDF downloaded!';
    toast(msg, 'succ');
    upProj({status:'Bids Collected'});

  } catch(e) {
    if (document.body.contains(container)) document.body.removeChild(container);
    console.error('PDF merge error:', e);
    toast('PDF generation failed: ' + e.message, 'err');
  }
}

/* =====================================================
   BID ATTACHMENT HANDLER
===================================================== */
function handleBidAttachment(input, ctrId) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast('File too large — max 20 MB', 'err'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const p = proj(); if (!p) return;
    const bids = {...(p.bids||{})};
    bids[ctrId] = {...(bids[ctrId]||{}), attachment: {name: file.name, data: e.target.result}};
    upProj({bids});
    render();
    toast('Attached: ' + file.name, 'succ');
  };
  reader.onerror = function() { toast('Could not read file', 'err'); };
  reader.readAsDataURL(file);
}
window.handleBidAttachment = handleBidAttachment;

/* =====================================================
   PHOTO HANDLING
===================================================== */
function handlePhotoUpload(files) {
  const p = proj();
  if (!p) return;
  let processed = 0;
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          const ratio = Math.min(MAX/w, MAX/h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const compressed = canvas.toDataURL('image/jpeg',0.8);
        const photos = [...(proj().photos||[]), compressed];
        upProj({photos});
        processed++;
        if (processed===files.length) { toast(`${processed} photo(s) added`,'succ'); render(); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function toggleContractor(id) {
  const p = proj(); if (!p) return;
  const sel = [...(p.selectedContractors||[])];
  const idx = sel.indexOf(id);
  if (idx>=0) sel.splice(idx,1); else sel.push(id);
  upProj({selectedContractors:sel});
  // Update UI without full re-render
  const item = document.querySelector(`[id="ctr-${id}"]`)?.closest('.ctr-item');
  if (item) {
    item.classList.toggle('selected', idx<0);
    const chk = item.querySelector('.ctr-chk');
    if (chk) chk.checked = idx<0;
  }
  // Update selected count
  const countEl = document.querySelector('.sel-count');
  if (countEl) countEl.textContent = `${proj().selectedContractors.length} selected`;
}

function saveNewContractor() {
  const name = document.getElementById('nc-name')?.value.trim();
  const trade = document.getElementById('nc-trade')?.value.trim();
  const email = document.getElementById('nc-email')?.value.trim();
  const lic = document.getElementById('nc-lic')?.value.trim();

  S.showAddCtr = false;
  toast(`${name} added`,'succ');

}

function deleteContractor(id) {
  S.contractors = S.contractors.filter(c=>c.id!==id);
  // Remove from any project selections
  S.projects.forEach(p=>{ p.selectedContractors=(p.selectedContractors||[]).filter(x=>x!==id); });
  saveData(); sbSaveContractors();
  render();
}

/* =====================================================
   BID INPUT HANDLER
===================================================== */
function handleBidInput(el) {
  const ctrId = el.dataset.ctr;
  const field = el.dataset.field;
  if (!ctrId||!field) return;
  const p = proj(); if (!p) return;
  const bids = {...(p.bids||{})};
  bids[ctrId] = {...(bids[ctrId]||{}), [field]: el.value};
  upProj({bids});
  // Recalc low bidder highlight
  recalcLowBidder();
}

function recalcLowBidder() {
  const p = proj(); if (!p) return;
  const selCtrs = (p.selectedContractors||[]).map(id=>S.contractors.find(c=>c.id===id)).filter(Boolean);
  const bids = p.bids||{};
  const recId = p.amgRecommended||'';
  // Update row highlighting based on AMG recommendation
  document.querySelectorAll('.bid-tbl tbody tr').forEach(row=>{
    const inp=row.querySelector('[data-ctr]');
    if (!inp) return;
    row.classList.toggle('low-bid',inp.dataset.ctr===recId);
  });
  // Update totals
  selCtrs.forEach(c=>{
    const b=bids[c.id]||{};
    const base=parseMoney(b.base);
    const alt1=parseMoney(b.alt1)||0;
    const alt2=parseMoney(b.alt2)||0;
    const total=base!==null?base+alt1+alt2:null;
    // Find the total cell for this contractor
    const row=document.querySelector(`[data-ctr="${c.id}"][data-field="base"]`)?.closest('tr');
    if (row) {
      const cells=row.querySelectorAll('td');
      // Total is the 4th or 5th td depending on alternates
      let totalIdx = 3;
      if (p.alternate1) totalIdx++;
      if (p.alternate2) totalIdx++;
      if(cells[totalIdx]) cells[totalIdx].textContent=total!==null?fmtMoney(total):'—';
    }
  });
}

/* =====================================================
   AFTER RENDER
===================================================== */
function afterRender() {
  // Photo upload
  const photoInput = document.getElementById('photo-input');
  if (photoInput) {
    photoInput.onchange = e => handlePhotoUpload(e.target.files);
  }
  // Drag and drop on photo zone
  const zone = document.getElementById('photo-zone');
  if (zone) {
    zone.ondragover = e => { e.preventDefault(); zone.style.background='var(--blue-lt)'; zone.style.borderColor='var(--blue)'; };
    zone.ondragleave = () => { zone.style.background=''; zone.style.borderColor=''; };
    zone.ondrop = e => { e.preventDefault(); zone.style.background=''; zone.style.borderColor=''; handlePhotoUpload(e.dataTransfer.files); };
  }
  // Bid inputs: save on change
  document.querySelectorAll('[data-action="bid-input"]').forEach(el => {
    el.oninput = () => handleBidInput(el);
  });
}

/* =====================================================
   TOAST
===================================================== */
function toast(msg, type='') {
  const ct = document.getElementById('toast-ct');
  const el = document.createElement('div');
  el.className = `toast${type?' '+type:''}`;
  const icons = {succ:'✓',err:'✕',warn:'⚠'};
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${esc(msg)}</span>`;
  ct.appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

/* =====================================================
   UTILITIES
===================================================== */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* =====================================================
   EVENT DELEGATION
===================================================== */
document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action) {
    case 'new-proj': newProj(); break;
    case 'open-proj': if(id) openProj(id); break;
    case 'delete-proj': if(id) showDeleteConfirm(id); break;
    case 'archive-proj': if(id) { const ap=S.projects.find(p=>p.id===id); if(ap){ap.archived=true; saveData(); sbSaveProject(ap); render(); toast('Project archived','succ');} } break;
    case 'unarchive-proj': if(id) { const up=S.projects.find(p=>p.id===id); if(up){delete up.archived; saveData(); sbSaveProject(up); render(); toast('Project restored');} } break;
    case 'dashboard': collectStep(S.step); showDashboard(); break;
    case 'next': nextStep(); break;
    case 'prev': prevStep(); break;
    case 'gen-docx': collectStep(S.step); generatePdf(); break;
    case 'gen-bid-pdf': generateBidCompPdf(); break;
    case 'remove-attachment': {
      const ctrId = el.dataset.ctr;
      if (ctrId) {
        const p = proj();
        if (p) {
          const bids = {...(p.bids||{})};
          bids[ctrId] = {...(bids[ctrId]||{})};
          delete bids[ctrId].attachment;
          upProj({bids}); render();
        }
      }
      break;
    }
    case 'mark-complete': upProj({status:'Complete'}); toast('Project marked as complete!','succ'); showDashboard(); break;
    case 'photo-zone-click': document.getElementById('photo-input')?.click(); break;
    case 'remove-photo': {
      const idx = parseInt(el.dataset.idx);
      const photos = [...(proj().photos||[])];
      photos.splice(idx,1);
      upProj({photos}); render(); break;
    }
    case 'toggle-ctr': {
      const ctrId = el.dataset.id;
      if (ctrId) toggleContractor(ctrId);
      break;
    }
    case 'show-add-ctr': S.showAddCtr=true; render(); break;
    case 'cancel-add-ctr': S.showAddCtr=false; render(); break;
    case 'save-ctr': saveNewContractor(); break;
    case 'del-ctr': if(id) deleteContractor(id); break;
    case 'copy-emails': {
      const emails = el.dataset.emails;
      navigator.clipboard?.writeText(emails).then(()=>toast('Email list copied!','succ')).catch(()=>toast('Could not copy','err'));
      break;
    }
    case 'copy-body': {
      const body = document.getElementById('f-ebody')?.value || document.querySelector('.email-prev')?.textContent || '';
      navigator.clipboard?.writeText(body).then(()=>toast('Email body copied!','succ')).catch(()=>toast('Could not copy','err'));
      break;
    }
    case 'toggle-edit-email': {
      collectStep(5);
      S.editEmailBody = !S.editEmailBody;
      render();
      break;
    }
    case 'mark-sent': markRfpSent(); break;
    case 'export-data': exportData(); break;
    case 'import-data': triggerImport(); break;
  }
});

  if (!apiKey) {
    apiKey = prompt('Enter your xAI API key to use Grok drafting:\n(Get one free at console.x.ai — stored locally, never shared)');
    if (!apiKey || !apiKey.trim()) return;
    S.apiKey = apiKey.trim();
    localStorage.setItem(API_KEY_STORE, S.apiKey);
  }

  const btn = document.getElementById('ai-draft-btn');
  const status = document.getElementById('ai-status');
  if (btn) { btn.disabled=true; btn.textContent='⏳ Drafting...'; }
  if (status) status.textContent = 'Generating scope with Grok...';

  try {
    const resp = await fetch('https://api.x.ai/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': `Bearer ${S.apiKey}`
      },
      body: JSON.stringify({
        model:'grok-3-mini',
        max_tokens:1500,
        messages:[{
          role:'system',
          content:'You are a professional property manager writing formal scope of work documents for condominium and HOA association RFPs. Write concise, specific bullet points suitable for a legal bid document.'
        },{
          role:'user',
          content:`Write a scope of work in bullet point format for the following project.

Project Name: ${projName}
Description: ${brief}

Instructions:
- Write 5-8 specific scope items, each starting with "• " on its own line
- Be specific about materials, methods, quantities, and standards
- The last line should be "Exclusions: " followed by any common exclusions for this type of work (or "None" if none apply)
- Do NOT include section headers, pricing, timelines, or any other text outside of the bullet points and the Exclusions line`
        }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(()=>({error:{message:'API error'}}));
      if (resp.status===401) {
        S.apiKey=''; localStorage.removeItem(API_KEY_STORE);
        throw new Error('Invalid API key — cleared. Re-enter to try again.');
      }
      throw new Error(err.error?.message || `API error ${resp.status}`);
    }

    const data = await resp.json();
    const raw = data.choices?.[0]?.message?.content?.trim() || '';
    if (!raw) throw new Error('No response from AI');

    // Split exclusions line from scope bullets
    const lines = raw.split('\n');
    const exclLine = lines.find(l => l.trim().startsWith('Exclusions:'));
    const scopeLines = lines.filter(l => !l.trim().startsWith('Exclusions:')).join('\n').trim();
    const exclText = exclLine ? exclLine.replace(/^Exclusions:\s*/i,'').trim() : '';

    const scopeEl = document.getElementById('f-scope');
    if (scopeEl) scopeEl.value = scopeLines;
    const exclEl = document.getElementById('f-excl');
    if (exclEl && exclText) exclEl.value = exclText;

    upProj({scopeDescription:scopeLines, scopeExclusions:exclText, scopeBrief:brief});
    toast('Scope drafted! Review and edit as needed.','succ');
    if (status) status.textContent = '✓ Scope drafted successfully';

  } catch(e) {
    console.error('AI draft error:',e);
    toast('AI error: ' + e.message,'err');
    if (status) status.textContent = '';
  } finally {
    if (btn) { btn.disabled=false; btn.textContent='🤖 Draft with AI'; }
  }
}
window.draftScopeWithAI = draftScopeWithAI;

/* =====================================================
   EXPORT / IMPORT (DATABASE ARCHIVE)
===================================================== */
function exportData() {
  const payload = {
    exportedAt: new Date().toISOString(),
    version: 2,
    projects: S.projects,
    contractors: S.contractors
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AMG-RFP-Archive-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${S.projects.length} project(s)`, 'succ');
}

function triggerImport() {
  document.getElementById('import-file-input')?.click();
}

function handleImportFile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.projects) throw new Error('Invalid backup file — no projects found');
      const existingIds = new Set(S.projects.map(p=>p.id));
      let added = 0, skipped = 0;
      const newProjects = [];
      data.projects.forEach(p => {
        if (existingIds.has(p.id)) { skipped++; }
        else { S.projects.push(p); newProjects.push(p); added++; }
      });
      if (data.contractors) {
        const existingCtrs = new Set(S.contractors.map(c=>c.id));
        data.contractors.forEach(c => { if (!existingCtrs.has(c.id)) S.contractors.push(c); });
        saveData(); sbSaveContractors();
      }
      saveData();
      newProjects.forEach(p => sbSaveProject(p)); // push each imported project to Supabase
      toast(`Imported ${added} project(s)${skipped>0?' ('+skipped+' skipped — already exist)':''}`, 'succ');
      render();
    } catch(err) {
      toast('Import failed: ' + err.message, 'err');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

/* =====================================================
   INIT
===================================================== */
loadData();   // instant load from localStorage cache
render();
sbLoad();     // then refresh from Supabase in background
document.addEventListener('change', e => {
  if (e.target.id === 'import-file-input') handleImportFile(e);
});

</script>
